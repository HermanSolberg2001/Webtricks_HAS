<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgave1</title>
</head>
<body>

    <p id="utskrift"></p>
    <script>
        const name = "Herman";
        let utskrift;

        if (name === "Herman") {
            utskrift = "Stemmer mitt navn er Herman";
        }
        else {
            utskrift = "Det er feil mitt navn er Herman";
        }

        document.getElementById("utskrift").innerHTML = utskrift;
    </script>
</body>
</html>
